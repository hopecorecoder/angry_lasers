<body>

    <canvas id="c" >
        <style >

            *{padding:0;margin:0}
            
        </style>
        <script>
            const ctx = c.getContext('2d');
            c.width = window.innerWidth;
            c.height = window.innerHeight;

            
                ctx.beginPath();
                ctx.fillStyle="lightblue";
                ctx.rect(0,0,1500,1000);
                ctx.fill();

                ctx.beginPath();
                ctx.fillStyle="green";
                ctx.rect(0,600,1500,220);
                ctx.fill();

                ctx.beginPath();
                ctx.fillStyle="black";
                ctx.rect(40,500,75,100);
                ctx.fill();

                
                ctx.beginPath();
                ctx.fillStyle="grey";
                ctx.rect(128,465,75,20);
                ctx.fill();
                const pivotX = 77.5; 
                const pivotY = 475
                
                ctx.beginPath();
                ctx.arc(pivotX, pivotY, 60, 0 , 2*Math.PI);
                ctx.fillStyle = 'grey';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(pivotX, pivotY, 50, 0 , 2*Math.PI);
                ctx.fillStyle = 'darkgrey';
                ctx.fill();
            
            let id=0,id2=0;
            let isMouseDown = false;
            document.addEventListener("mousedown",drawCircle);
            let radius=0.0;


            function drawTurret(e) {
            const dx = e.clientX - pivotX;
            const dy = e.clientY - pivotY;
            const angle = Math.atan2(dy, dx);

            // 2. ERASE OLD BARREL: Clear the bounding region around the turret head
            // (Clears a 200x200 box centered at pivotX, pivotY)
            ctx.clearRect(pivotX - 100, pivotY - 100, 300, 200);

            // 3. REDRAW BACKGROUND / BASE UNDERNEATH THE CLEARED AREA
            // Sky portion
            ctx.fillStyle = "lightblue";
            ctx.fillRect(pivotX - 100, pivotY - 125, 400, 125 + (600 - pivotY));

            // Ground portion if within cleared box (ground starts at y = 600)
            if (pivotY + 100 > 600) {
                ctx.fillStyle = "green";
                ctx.fillRect(pivotX - 100, 600, 200, (pivotY + 100) - 600);
            }

            // Black Base Box
            ctx.fillStyle = "black";
            ctx.fillRect(40, 500, 75, 100);

            // 4. DRAW ROTATED BARREL
            ctx.save();
                ctx.translate(pivotX, pivotY);
                ctx.rotate(angle);

                // Barrel extending toward cursor
                ctx.beginPath();
                ctx.fillStyle = "grey";
                ctx.rect(0, -10, 125, 20);
                ctx.fill();
                ctx.restore();

            // 5. REDRAW STATIC DOME OVER THE BARREL JOINT
            ctx.beginPath();
            ctx.arc(pivotX, pivotY, 60, 0, 2 * Math.PI);
            ctx.fillStyle = 'grey';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(pivotX, pivotY, 50, 0, 2 * Math.PI);
            ctx.fillStyle = 'darkgrey';
            ctx.fill();
        }
            function drawCircle(e){
                isMouseDown=true;
                hasBegun=true;
                 id = setInterval(frame, 150);
              
                    function frame() {

                        
                        
                        if(radius>=45)
                         {
                            clearInterval(id);   
                                     
                         }   
                        else
                        {
                            
                            ctx.beginPath();
                            ctx.arc(pivotX, pivotY, radius, 0 , 2*Math.PI);
                            ctx.fillStyle = 'red';
                            ctx.fill();
                            radius+=5;

                        }
                        
                    }
                }
                
            

            document.addEventListener('mousemove',(e)=>{
                if(!isMouseDown){
                    drawTurret(e)
                }
            })
            document.addEventListener("mouseup",destroyCircle);
            function destroyCircle(e){
                isMouseDown=false;
                clearInterval(id);
                ctx.beginPath();
                ctx.arc(pivotX, pivotY, 50, 0 , 2*Math.PI);
                ctx.fillStyle = 'darkgrey';
                ctx.fill();
                if(radius>=45) {shootLaser(e)}
                radius=0.0;
            }
            function shootLaser(e){
                
                const x=e.clientX;
                const y =e.clientY;
                existingEnemies = existingEnemies.filter((enemy) => {
                let hit = x >= enemy.x && x <= enemy.x + 42 && y >= enemy.y && y <= enemy.y + 20;
                if (hit) {
                    enemies++;//remove dead entity
                    ctx.beginPath();
                     ctx.fillStyle = "lightblue";
                     ctx.fillRect(enemy.x, enemy.y, 30, 30);
                     ctx.fill();
                    return false; // remove enemy

                }
                return true;
            });
                if(!(x>210))return;
                ctx.beginPath();
                ctx.moveTo(190,465)
                ctx.lineTo(x, y);
                ctx.lineWidth=7;
                ctx.strokeStyle="red";
                ctx.stroke();
                setTimeout(()=>{
                    ctx.beginPath();
                    ctx.moveTo(190,465)
                    ctx.lineTo(x, y);
                    ctx.lineWidth=10;
                    ctx.strokeStyle="lightblue";
                    ctx.stroke();
                },750)
                
            }
            
            let wave=0;
            let hasBegun=false;
            let enemies =0;
            
            let existingEnemies = [];
            function update(dt,enemy) {
            // move 50 pixels every second, and wrap around at the edge
                    let x = enemy- ( 500 * dt);
                    return x;
            }
            function drawEnemies() {
                if(existingEnemies.length!=0){
                   
                    existingEnemies.map((enemy)=>{
                        //remove old entity
                        ctx.beginPath();
                        ctx.fillStyle = "lightblue";
                        ctx.fillRect(enemy.x, enemy.y, 30, 30);
                        ctx.fill();
                        enemy.x = update(dtGlobal,enemy.x);
                        //add new entity at new position
                        ctx.beginPath();
                        ctx.fillStyle="black";
                        ctx.fillRect(enemy.x, enemy.y, 20, 20);
                        ctx.fill();

                    })
                }
                else{
                    wave++;
                    for(let i=0; i<5+(wave-1);i++){
                        let x = Math.floor(Math.random()*200)+1320;
                        let y = Math.floor(Math.random()*200)+400;
                        while(y>500)
                            y = Math.floor(Math.random()*200)+400;
                        existingEnemies.push({x:x, y:y})
                        
                        
                    }
                }
                
            }
            function cleanupEnemies() {
            existingEnemies = existingEnemies.filter((enemy) => {
                // If an enemy reaches or crosses the turret area (x <= 115)
                if (enemy.x <= 115) {
                    isGameOver = true;
                    return false;
                }
                return true;
            });
        }
            let isGameOver = false;
            let last = 0;
            let dtGlobal = 0;
            function frame(now) {
            
            requestAnimationFrame(frame);
            if(!hasBegun){
                ctx.font = "60px Arial";
                ctx.fillStyle="darkblue"
                ctx.fillText("Hold to shoot laser",300,200);
                
            }
            cleanupEnemies();
            if(hasBegun && !isGameOver){
                ctx.beginPath();
                ctx.fillStyle="lightblue"
                ctx.fillRect(300,105,1000,100);
                ctx.fill();
                // 1. Clear the text area for Wave and Enemies Killed before redrawing
                ctx.beginPath();
                ctx.fillStyle = "green"; // matches your ground background
                ctx.fillRect(15, 610, 300, 90);
                ctx.fill();

                // 2. Render updated text
                ctx.font = "30px Arial";
                ctx.fillStyle = "darkblue";
                ctx.fillText("Wave: " + wave, 20, 650);
                ctx.fillText("Enemies killed: " + enemies, 20, 680);

                dtGlobal = Math.min((now - last) / 1000, 0.1);
                last = now;
                drawEnemies(); 
            }
            if (isGameOver) {
                ctx.beginPath();
                ctx.font = "70px Arial";
                ctx.fillStyle = "red";
                ctx.fillText("YOU LOST!",300,200);
                wave=0;
                enemies=0;

                return; 
            }
           
            }
            requestAnimationFrame(frame);
        </script>
    </canvas>
  </body>
